<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07050a">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>solvia F Motion</title>
  <style>html,body{margin:0;background:#07050a;color:#fff}.boot{min-height:100svh;display:grid;place-items:center;font:600 32px serif;color:#f64991}</style>
</head>
<body>
  <div class="boot">solvia</div>
  <script src="./payload-01.js"></script>
  <script src="./payload-02.js"></script>
  <script src="./payload-03.js"></script>
  <script src="./payload-04a.js"></script>
  <script src="./payload-04b.js"></script>
  <script src="./payload-04c.js"></script>
  <script src="./payload-04d.js"></script>
  <script src="./payload-04e.js"></script>
  <script src="./payload-05.js"></script>
  <script src="./payload-06.js"></script>
  <script>
    (async()=>{
      try{
        const b=Uint8Array.from(atob(window.__SOLVIA_PAYLOAD),c=>c.charCodeAt(0));
        const t=await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
        document.open();document.write(t);document.close();
      }catch(e){
        document.body.innerHTML='<main style="min-height:100svh;display:grid;place-items:center;padding:24px;font-family:system-ui;color:#ff5a9d;background:#08040a">Page loading failed.</main>';
        console.error(e);
      }
    })();
  </script>
</body>
</html>
